name: CI

on:
  pull_request:
    # `edited` re-runs CI when the PR title changes, so the title lint stays current.
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Jobs call the same Makefile targets developers run locally (make pr-ready),
# so the commitlint version and test behavior live in one place.
env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  commitlint:
    name: Commit messages & PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint commit messages in this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make lint-commits FROM="$BASE_SHA" TO="$HEAD_SHA"

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: make lint-title

  secrets:
    name: Secret scan (gitleaks)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (version pinned in .pre-commit-config.yaml)
        working-directory: ${{ runner.temp }}
        env:
          CONFIG: ${{ github.workspace }}/.pre-commit-config.yaml
        run: |
          version=$(yq '.repos[] | select(.repo == "https://github.com/gitleaks/gitleaks") | .rev' "$CONFIG")
          version=${version#v}
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -sSfLO "${url}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfLO "${url}/gitleaks_${version}_checksums.txt"
          grep " gitleaks_${version}_linux_x64.tar.gz\$" "gitleaks_${version}_checksums.txt" | sha256sum --check
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks

      - name: Scan every commit in this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --log-opts="${BASE_SHA}..${HEAD_SHA}" --redact --verbose .

  lint:
    name: Lint (pre-commit hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev tooling
        run: pip install -r requirements-dev.txt

      - name: Run pre-commit hooks on all files
        run: make lint

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements-dev.txt

      - name: Run tests
        # Passes when no tests exist yet (pytest exit code 5); see Makefile.
        run: make test

  # Add jobs above as the project grows, and list each one under `needs` below.
  # Planned:
  #   docker: build the image and smoke-test `serve` once the Dockerfile lands
  #   deploy: CD to the cloud platform on push to main (provider TBD)

  ci-passed:
    name: CI passed
    # The only check branch protection requires. It passes when every job in
    # `needs` succeeded or was skipped, so adding jobs never means editing
    # branch protection.
    if: always()
    needs: [commitlint, secrets, lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: All checks passed
        run: echo "All CI jobs passed or were skipped."
