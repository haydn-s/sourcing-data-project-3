# Weekly dependency update PRs. Commit prefixes follow Conventional Commits so
# Dependabot's PRs pass commitlint. Minor/patch bumps are grouped to cut noise.
version: 2
updates:
  - package-ecosystem: pip
    # Add "/frontend" once frontend/requirements.txt exists.
    directories: ["/"]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      pre-commit-hooks:
        patterns: ["*"]
