# Weekly dependency update PRs. Minor/patch bumps are grouped to cut noise.
# Commit prefixes use Conventional Commit types so the history reads cleanly,
# but Dependabot capitalizes "Bump", which commitlint rejects, so CI skips
# commitlint on Dependabot's PRs (.github/workflows/ci.yml).
version: 2
updates:
  - package-ecosystem: pip
    # frontend/ has its own requirements.txt, for Streamlit Community Cloud.
    directories: ["/", "/frontend"]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # The Python base image and the Lambda Web Adapter pinned in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      pre-commit-hooks:
        patterns: ["*"]
