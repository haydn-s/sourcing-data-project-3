# Weekly dependency update PRs. Minor/patch bumps are grouped to cut noise.
# Commit prefixes use Conventional Commit types so the history reads cleanly,
# but Dependabot capitalizes "Bump", which commitlint rejects, so CI skips
# commitlint on Dependabot's PRs (.github/workflows/ci.yml).
version: 2
updates:
  - package-ecosystem: pip
    # Add "/frontend" once frontend/requirements.txt exists.
    directories: ["/"]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # The Python base image pinned in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      # Python stays on the version PyDev and CI use (3.12): a new minor version
      # can lack wheels for our pins (3.15 had none for PyYAML). Move all three together.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      pre-commit-hooks:
        patterns: ["*"]
