# Pipeline configuration. Every data and training parameter lives here, in
# three parts: what both pipelines agree on, then each pipeline's own settings.
#
# Until we pick a dataset (kickoff decision 1), this trains on a synthetic demo
# dataset. Create it with `make demo-data`. Swapping in the real dataset means
# editing the data, features, task, and evaluation sections, not the code.
#
# Experiment variants live in configs/ and inherit from this file (`extends:`).
# Override single values from the command line:
#   python -m ml_pipeline.train --config config.yaml --set model.params.max_depth=5
# Relative paths are relative to the repo root (the container's /app).

# ── Shared: the hand-off between the pipelines ─────────────────────────────
# The data pipeline produces this table, and the ML pipeline trains on it.
# `make push` refuses a table that lacks these features or the target.

data:
  # The data pipeline writes local_path and pushes it to remote_uri. Training
  # downloads remote_uri to local_path (when it's set). CSV or Parquet, by extension.
  remote_uri: null                # e.g. gs://climate-impact-pipeline-data/processed/<file>.parquet
  local_path: data/demo/demo.csv
  target: churned

features:
  # Columns not listed here (other than the target) are ignored.
  numeric: [age, monthly_spend, support_calls]
  categorical: [region, plan]

# ── Data pipeline (data_pipeline/): make ingest → make prepare → make push ──

# Stage 1, ingest: fetch each source and save it unchanged as <raw_dir>/<name>.csv.
# The demo dataset has no sources: make demo-data writes it directly.
ingest:
  raw_dir: data/raw
  remote_prefix: gs://climate-impact-pipeline-data/raw  # snapshots are uploaded here too
  # The first source is the base table. Each later source with join_on is
  # joined onto it by those columns (how: left by default, or inner); a source
  # without join_on stays out of the join but feature steps can use it.
  # ${NAME} values come from environment variables (.env), so keys stay out of git.
  sources: []
  # Examples:
  #   - name: colonies              # lowercase, used for file and cleaner names
  #     type: http                  # a GET request to a web API
  #     url: https://quickstats.nass.usda.gov/api/api_GET/
  #     params: {key: "${NASS_API_KEY}", commodity_desc: HONEY, format: JSON}
  #     format: json                # json (default) or csv
  #     records: data               # dotted key path to the list of records
  #   - name: climate
  #     type: file                  # CSV/Parquet: local path, http(s) URL, or gs://
  #     uri: https://example.org/state-climate.csv
  #     join_on: [state, year]
  # Other types (paging APIs, several requests) are registered in data_pipeline/ingest.py.

# Stage 2, prepare: clean each source (data_pipeline/prepare.py), join them,
# then run these feature steps in order. Stage 3, push, uploads the result
# to data.remote_uri.
prepare:
  feature_steps: []               # names registered with @feature_step in data_pipeline/prepare.py

# ── ML pipeline (ml_pipeline/): make train ──────────────────────────────────

seed: 42
task: classification              # classification | regression

split:
  test_size: 0.15
  val_size: 0.15
  stratify: true                  # keep class proportions; classification only
  # For data that changes over time, name a time column (year, date, ...) to
  # split by time instead: the latest rows are the test set. Stratify is ignored.
  time_column: null

model:
  # dummy (baseline) | linear | random_forest | hist_gradient_boosting | xgboost
  type: random_forest
  # Passed straight to the scikit-learn estimator. A variant that sets params
  # replaces this whole mapping. random_state comes from `seed` unless set here.
  params:
    n_estimators: 200
    max_depth: 10

evaluation:
  # classification: accuracy | f1 (macro) | roc_auc; regression: rmse | mae | r2
  primary_metric: f1

tracking:
  project: sourcing-data-project-3   # W&B project
  entity: dhs27-duke-university      # W&B team, so everyone's runs land in one project
  tags: [demo]

output:
  local_dir: models               # each run writes models/<run-id>/ and models/latest/
  # Set to gs://climate-impact-pipeline-data/models once this config trains the
  # real dataset. Until then, leaving it null keeps demo models out of the
  # bucket, where models/latest/ is what the deployed API serves.
  remote_prefix: null
