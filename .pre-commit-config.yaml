# Git hooks managed by pre-commit (https://pre-commit.com).
#   Install once per clone:  pre-commit install
#   Run on all files:        pre-commit run --all-files
# CI runs the same pre-commit-stage hooks on every PR.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # Commit messages: Conventional Commits (rules in .commitlintrc.yaml)
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@21.2.4"]

  # Python lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
