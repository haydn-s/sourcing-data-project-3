# Demo variant: runs the data pipeline end to end on synthetic customer data,
# with its own target and features, so both pipelines can be tested apart from
# the real weather dataset in config.yaml.
#
#   make data CONFIG=configs/demo.yaml     # ingest -> prepare -> push
#
# Training can then read data.remote_uri below with --config configs/demo.yaml.
# Everything this writes stays under demo/ in the bucket, apart from the real
# dataset's raw/ and processed/.
extends: ../config.yaml

data:
  remote_uri: gs://climate-impact-pipeline-data/demo/processed/customers.parquet
  local_path: data/demo/processed/customers.parquet
  target: churned

features:
  numeric: [age, monthly_spend, support_calls]
  categorical: [region, plan]

ingest:
  raw_dir: data/demo/raw
  remote_prefix: gs://climate-impact-pipeline-data/demo/raw
  sources:
    # 400 synthetic customers (age, region, plan, monthly_spend, support_calls,
    # churned, lifetime_value), generated by the demo-data script removed in #3.
    # The bucket is public, so this reads with no Google login.
    - name: customers
      type: file
      uri: gs://climate-impact-pipeline-data/demo/source/customers.csv

prepare:
  feature_steps: []               # the weather steps don't apply here
  step_options: {}
